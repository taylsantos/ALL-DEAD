<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Financeiro - Chat</title>
  <!-- Tailwind CSS para o visual -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col md:flex-row p-4 gap-4">

  <!-- PAINEL DA ESQUERDA: CHAT -->
  <div class="flex-1 bg-white rounded-xl shadow-md flex flex-col h-full overflow-hidden">
    <!-- Cabeçalho -->
    <div class="p-4 bg-indigo-600 text-white font-bold flex justify-between items-center">
      <span>💬 Chat Financeiro</span>
      <input id="apiKeyInput" type="password" placeholder="Cole sua Gemini API Key aqui" 
             class="text-black text-sm px-2 py-1 rounded w-60 border-none outline-none">
    </div>

    <!-- Mensagens do Chat -->
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3">
      <div class="bg-gray-100 p-3 rounded-lg max-w-[80%] text-gray-800">
        Olá! Eu sou seu assistente financeiro. Digite quanto você gastou ou recebeu (ex: <i>"Gastei R$ 35 no mercado hoje"</i>).
      </div>
    </div>

    <!-- Input de Texto -->
    <div class="p-4 border-t flex gap-2">
      <input id="userInput" type="text" placeholder="Digite seu gasto ou ganho..." 
             class="flex-1 border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
             onkeypress="if(event.key === 'Enter') processarMensagem()">
      <button onclick="processarMensagem()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 font-semibold">
        Enviar
      </button>
    </div>
  </div>

  <!-- PAINEL DA DIREITA: GRÁFICO E HISTÓRICO -->
  <div class="w-full md:w-96 bg-white rounded-xl shadow-md p-4 flex flex-col h-full gap-4">
    <h2 class="text-lg font-bold text-gray-700 border-b pb-2">📊 Resumo de Gastos</h2>
    
    <!-- Gráfico -->
    <div class="relative flex-1 max-h-[250px] flex justify-center items-center">
      <canvas id="financeChart"></canvas>
    </div>

    <!-- Tabela / Lista de Registros -->
    <div class="flex-1 overflow-y-auto border-t pt-2">
      <div class="flex justify-between items-center mb-2">
        <span class="font-semibold text-sm text-gray-600">Histórico</span>
        <button onclick="limparDados()" class="text-xs text-red-500 hover:underline">Limpar Tudo</button>
      </div>
      <ul id="listaGastos" class="space-y-2 text-sm"></ul>
    </div>
  </div>

  <!-- LÓGICA EM JAVASCRIPT -->
  <script>
    let transacoes = JSON.parse(localStorage.getItem('transacoes')) || [];
    let myChart = null;

    // Inicializa o gráfico e a lista ao carregar
    window.onload = () => {
      atualizarInterface();
    };

    async function processarMensagem() {
      const input = document.getElementById('userInput');
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const texto = input.value.trim();

      if (!texto) return;
      if (!apiKey) {
        alert("Por favor, cole sua Gemini API Key no campo superior direito!");
        return;
      }

      // Adiciona mensagem do usuário na tela
      adicionarMensagemChat(texto, 'user');
      input.value = '';

      // Prompt para forçar o Gemini a responder em JSON estrito
      const prompt = `Analise a mensagem do usuário: "${texto}".
Extraia as informações e retorne EXATAMENTE um JSON com este formato (sem formatação markdown ```json):
{
  "descricao": "breve descrição do gasto ou ganho",
  "valor": numero_positivo,
  "categoria": "uma categoria curta (ex: Alimentação, Transporte, Lazer, Casa, Renda, Outros)",
  "tipo": "SAIDA" ou "ENTRADA",
  "resposta": "uma frase curta amigável confirmando o registro"
}`;

      try {
        const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text.trim();
        
        // Trata a resposta limpando formatações markdown se existirem
        const cleanJsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const resultado = JSON.parse(cleanJsonText);

        // Salva a transação
        transacoes.push(resultado);
        localStorage.setItem('transacoes', JSON.stringify(transacoes));

        // Responde no chat e atualiza os gráficos
        adicionarMensagemChat(resultado.resposta, 'bot');
        atualizarInterface();

      } catch (error) {
        console.error(error);
        adicionarMensagemChat("Ops! Não consegui entender essa transação ou a API Key está incorreta.", 'bot');
      }
    }

    function adicionarMensagemChat(texto, autor) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = autor === 'user' 
        ? "bg-indigo-600 text-white p-3 rounded-lg max-w-[80%] ml-auto text-right"
        : "bg-gray-100 p-3 rounded-lg max-w-[80%] text-gray-800";
      div.innerHTML = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function atualizarInterface() {
      // Atualizar Lista
      const lista = document.getElementById('listaGastos');
      lista.innerHTML = '';
      
      const categoriasValores = {};

      transacoes.forEach(t => {
        // Popula Lista
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-gray-50 p-2 rounded border";
        const corTexto = t.tipo === 'ENTRADA' ? 'text-green-600' : 'text-red-600';
        const sinal = t.tipo === 'ENTRADA' ? '+' : '-';
        li.innerHTML = `<span><b>${t.descricao}</b> <small class="text-gray-400">(${t.categoria})</small></span>
                        <span class="${corTexto} font-bold">${sinal} R$ ${t.valor.toFixed(2)}</span>`;
        lista.appendChild(li);

        // Agrupa por Categoria para o Gráfico (apenas saídas)
        if (t.tipo === 'SAIDA') {
          categoriasValores[t.categoria] = (categoriasValores[t.categoria] || 0) + t.valor;
        }
      });

      // Atualizar Gráfico
      renderizarGrafico(categoriasValores);
    }

    function renderizarGrafico(dados) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      const labels = Object.keys(dados);
      const valores = Object.values(dados);

      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels.length ? labels : ['Sem dados'],
          datasets: [{
            data: valores.length ? valores : [1],
            backgroundColor: [
              '#4F46E5', '#EF4444', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#6B7280'
            ]
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    function limparDados() {
      if (confirm("Deseja apagar todo o histórico de gastos?")) {
        transacoes = [];
        localStorage.removeItem('transacoes');
        atualizarInterface();
      }
    }
  </script>
</body>
</html>
